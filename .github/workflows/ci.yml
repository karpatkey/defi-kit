name: Continuous integration checks

on: [push]

env:
  ETH_FORK_RPC: ${{ secrets.ETH_FORK_RPC }}
  ARB1_FORK_RPC: ${{ secrets.ARB1_FORK_RPC }}
  GNO_FORK_RPC: ${{ secrets.GNO_FORK_RPC }}
  OETH_FORK_RPC: ${{ secrets.OETH_FORK_RPC }}
  BASE_FORK_RPC: ${{ secrets.BASE_FORK_RPC }}

jobs:
  checks:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v3
        with:
          path: |
            **/node_modules
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock', '.yarnrc.yml') }}
      - name: Install dependencies & setup
        run: |
          yarn -v
          yarn
          yarn setup

      - name: Check formatting
        run: yarn check:prettier
      - name: Build all packages
        run: yarn build

  test:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-${{ matrix.label }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      # Each shard starts FIVE anvil forks (eth, arb1, gno, oeth, base) via
      # `yarn anvil`, because global-setup.ts prepares every chain in
      # `Object.values(Chain)` regardless of which one the shard tests. With 16
      # shards unthrottled that is up to 80 concurrent archive-syncing forks
      # against the same RPC, which gets us rate-limited (429/502/503 served as
      # HTML, surfacing as `SyntaxError: Unexpected token '<'` in the tests).
      # Throttling spreads the load instead of rationing the plan.
      max-parallel: 4
      matrix:
        label:
          [
            general,
            aave/v3,
            ankr,
            balancer,
            circle,
            compound/v3,
            convex,
            cowSwap,
            fluid,
            lido,
            rocketPool,
            sky,
            spark,
            stader,
            stakeWise/v3,
            uniswap,
          ]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v3
        with:
          path: |
            **/node_modules
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock', '.yarnrc.yml') }}
      - name: Install dependencies & setup
        run: |
          yarn -v
          yarn
          yarn setup
      - name: Install anvil
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # foundryup now refuses releases without a Sigstore attestation, and the
          # nightly this was pinned to (nightly-fd565286…, 2025) predates them:
          #   "requires a Sigstore attestation; refusing to download unverified binaries"
          # Pinned to a stable tag rather than a nightly so this cannot recur.
          # https://github.com/foundry-rs/foundry/releases/tag/v1.8.6
          version: v1.8.6

      - name: Run tests
        run: |
          cd sdk
          yarn test ${{ matrix.label }}
