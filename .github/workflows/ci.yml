name: Continuous integration checks

on: [push]

env:
  ETH_FORK_RPC: ${{ secrets.ETH_FORK_RPC }}
  ARB1_FORK_RPC: ${{ secrets.ARB1_FORK_RPC }}
  GNO_FORK_RPC: ${{ secrets.GNO_FORK_RPC }}
  OETH_FORK_RPC: ${{ secrets.OETH_FORK_RPC }}
  BASE_FORK_RPC: ${{ secrets.BASE_FORK_RPC }}

jobs:
  checks:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v3
        with:
          path: |
            **/node_modules
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock', '.yarnrc.yml') }}
      - name: Install dependencies & setup
        run: |
          yarn -v
          yarn
          yarn setup

      - name: Check formatting
        run: yarn check:prettier
      - name: Build all packages
        run: yarn build

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-${{ matrix.label }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      # TEMPORARY PROBE - do not merge as is.
      # Measures whether the RPC failures are load-driven at all. These five
      # shards are eth-only and all fail today. With TEST_CHAINS=eth each starts
      # ONE fork instead of five, so the whole run opens 5 upstream connections
      # against the ~20 that `max-parallel: 4` produced (and 80 unthrottled).
      # All green  -> load matters, scope the forks per shard for real.
      # Still red  -> the RPC is simply unreliable; drop this and wait.
      matrix:
        label: [lido, rocketPool, stader, ankr, sky]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v3
        with:
          path: |
            **/node_modules
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock', '.yarnrc.yml') }}
      - name: Install dependencies & setup
        run: |
          yarn -v
          yarn
          yarn setup
      - name: Install anvil
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # foundryup now refuses releases without a Sigstore attestation, and the
          # nightly this was pinned to (nightly-fd565286…, 2025) predates them:
          #   "requires a Sigstore attestation; refusing to download unverified binaries"
          # Pinned to a stable tag rather than a nightly so this cannot recur.
          # https://github.com/foundry-rs/foundry/releases/tag/v1.8.6
          version: v1.8.6

      - name: Run tests
        env:
          TEST_CHAINS: eth
        run: |
          cd sdk
          yarn test ${{ matrix.label }}
